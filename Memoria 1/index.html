<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Especial | Ikigai Gift Shop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf8f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .cartao {
            background: #ffffff;
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 24px;
            text-align: center;
        }
        .marca {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8c7a6b;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .foto {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 18px;
            object-fit: cover;
        }
        .mensagem {
            font-size: 16px;
            line-height: 1.5;
            color: #444;
            margin-bottom: 20px;
            font-style: italic;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="cartao">
        <div class="marca">Ikigai Gift Shop</div>
        <img src="foto.jpg" alt="Memória Especial" class="foto">
        <p class="mensagem">"Escreve aqui a dedicatória especial do cliente."</p>
        <audio controls autoplay>
            <source src="musica.mp3" type="audio/mpeg">
            O teu telemóvel não suporta este áudio.
        </audio>
    </div>
</body>
</html>
